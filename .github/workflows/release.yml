name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - macos-latest
          - windows-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Windows SDK (Windows only)
        if: matrix.os == 'windows-latest'
        run: |
          choco install windows-sdk-10.0 -y
          $vsInstaller = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe'
          if (Test-Path $vsInstaller) {
            & $vsInstaller modify --installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" --add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --add Microsoft.VisualStudio.Component.Windows10SDK.22621 --passive
          } else {
            Write-Host "vs_installer.exe not found; skipping Visual Studio modify step"
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js assets
        run: |
          cd ai-kawaii-nextjs
          npm ci
          npm run build

      - name: Rebuild native modules
        run: npm run rebuild

      - name: Package for macOS
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac --arm64 --x64 --publish always

      - name: Package for Windows
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --x64 --publish always
