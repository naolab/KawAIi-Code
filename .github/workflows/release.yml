name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - macos-latest
          - windows-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Windows SDK (Windows only)
        if: matrix.os == 'windows-latest'
        run: |
          choco install windows-sdk-10.0 --version=10.0.22621.795 -y
          setx WindowsSdkDir "C:\Program Files (x86)\Windows Kits\10"
          setx WindowsSdkBinPath "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js assets
        run: |
          cd ai-kawaii-nextjs
          npm ci
          npm run build

      - name: Rebuild native modules
        run: npm run rebuild

      - name: Package for macOS
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac --arm64 --x64 --publish always

      - name: Package for Windows
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --x64 --publish always
